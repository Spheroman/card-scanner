# fly.toml app configuration file generated for card-scanner on 2026-02-13T04:02:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'card-scanner'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
